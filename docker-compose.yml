services:
  postgres:
    image: postgres:16
    container_name: k8s-proxmox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: k8s_proxmox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d k8s_proxmox"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: https://goproxy.cn,https://proxy.golang.org,https://goproxy.io
        GOSUMDB: "off"
    container_name: k8s-proxmox-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/k8s_proxmox?sslmode=disable
      AUTO_MIGRATE: "true"
      JWT_SECRET: change-me-in-prod
      JWT_TTL_MINUTES: "120"
      SUPER_ADMIN_USERNAME: k8s-admin
      SUPER_ADMIN_PASSWORD: ChangeMeNow!
      DEFAULT_NETWORK_NAME: homelab-default
      DEFAULT_NETWORK_CIDR: 192.168.8.0/24
      DEFAULT_NETWORK_GATEWAY: 192.168.8.1
      DEFAULT_NETWORK_DNS: 1.1.1.1,8.8.8.8
      DEFAULT_NETWORK_BRIDGE: vmbr0
      DEFAULT_NETWORK_VLAN: "0"
      TERRAFORM_WORKDIR: /app/backend/data/terraform/runs
      ANSIBLE_WORKDIR: /app/backend/data/ansible/runs
      OPERATIONS_WORKDIR: /app/backend/data/operations/runs
      TERRAFORM_AUTO_APPLY: "false"
      ANSIBLE_AUTO_APPLY: "false"
      KUBECONFIG: /app/backend/.kube/config
    dns:
      - 192.168.8.1
      - 8.8.8.8
    ports:
      - "8080:8080"
    volumes:
      - ./infra:/app/backend/infra
      - ./backups:/app/backend/backups
      - backend_data:/app/backend/data
      - ~/.kube:/app/backend/.kube:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: k8s-proxmox-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/etc/nginx/certs:ro

  kubectl-runner:
    image: bitnami/kubectl:1.30
    container_name: k8s-proxmox-kubectl-runner
    profiles:
      - ops
    depends_on:
      - backend
    environment:
      KUBECONFIG: /app/backend/.kube/config
    entrypoint: ["/bin/sh", "-lc"]
    command: ["sleep infinity"]
    volumes:
      - backend_data:/app/backend/data
      - ${KUBECONFIG_DIR:-~/.kube}:/app/backend/.kube:ro

volumes:
  postgres_data:
  backend_data:
