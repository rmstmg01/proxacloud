services:
  postgres:
    image: postgres:16
    container_name: proxacloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: k8s_proxmox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d k8s_proxmox"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: https://goproxy.cn,https://proxy.golang.org,https://goproxy.io
        GOSUMDB: "off"
    container_name: proxacloud-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/k8s_proxmox?sslmode=disable
      AUTO_MIGRATE: "true"
      JWT_SECRET: change-me-in-prod
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-dev-only-change-me-secret-key}
      JWT_TTL_MINUTES: "120"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PROXACLOUD_TUNNEL_ENABLED: ${PROXACLOUD_TUNNEL_ENABLED:-false}
      PROXACLOUD_TUNNEL_API_URL: ${PROXACLOUD_TUNNEL_API_URL:-}
      PROXACLOUD_TUNNEL_API_TOKEN: ${PROXACLOUD_TUNNEL_API_TOKEN:-}
      PROXACLOUD_TUNNEL_GATEWAY_URL: ${PROXACLOUD_TUNNEL_GATEWAY_URL:-}
      PROXACLOUD_TUNNEL_PUBLIC_HOSTNAME: ${PROXACLOUD_TUNNEL_PUBLIC_HOSTNAME:-}
      PROXACLOUD_TUNNEL_HOSTNAME_SUFFIX: ${PROXACLOUD_TUNNEL_HOSTNAME_SUFFIX:-.proxaops.com}
      PROXACLOUD_TUNNEL_HTTP_TARGET_URL: ${PROXACLOUD_TUNNEL_HTTP_TARGET_URL:-http://127.0.0.1:80}
      PROXACLOUD_TUNNEL_SSH_HOST: ${PROXACLOUD_TUNNEL_SSH_HOST:-127.0.0.1}
      PROXACLOUD_TUNNEL_SSH_PORT: ${PROXACLOUD_TUNNEL_SSH_PORT:-22}
      PROXACLOUD_TUNNEL_PUBLIC_PORT_START: ${PROXACLOUD_TUNNEL_PUBLIC_PORT_START:-22000}
      PROXACLOUD_TUNNEL_PUBLIC_PORT_END: ${PROXACLOUD_TUNNEL_PUBLIC_PORT_END:-29999}
      PROXACLOUD_TUNNEL_AGENT_BINARY_URL: ${PROXACLOUD_TUNNEL_AGENT_BINARY_URL:-}
      SUPER_ADMIN_USERNAME: k8s-admin
      SUPER_ADMIN_PASSWORD: ChangeMeNow!
      DEFAULT_NETWORK_NAME: homelab-default
      DEFAULT_NETWORK_CIDR: 192.168.8.0/24
      DEFAULT_NETWORK_GATEWAY: 192.168.8.1
      DEFAULT_NETWORK_DNS: 1.1.1.1,8.8.8.8
      DEFAULT_NETWORK_BRIDGE: vmbr0
      DEFAULT_NETWORK_VLAN: "0"
      TERRAFORM_WORKDIR: /app/backend/data/terraform/runs
      ANSIBLE_WORKDIR: /app/backend/data/ansible/runs
      OPERATIONS_WORKDIR: /app/backend/data/operations/runs
      TERRAFORM_AUTO_APPLY: "false"
      ANSIBLE_AUTO_APPLY: "false"
      KUBECONFIG: /app/backend/.kube/config
    dns:
      - 192.168.8.1
      - 8.8.8.8
    ports:
      - "8080:8080"
    volumes:
      - ./infra:/app/backend/infra
      - ./backups:/app/backend/backups
      - backend_data:/app/backend/data
      # Mount the host kubeconfig directory, not the kubeconfig file.
      # On the hosted Linux server this makes auto-bootstrap write /root/.kube/config
      # through /app/backend/.kube/config, equivalent to docker cp + chmod 600.
      - ${KUBECONFIG_DIR:-/root/.kube}:/app/backend/.kube:rw

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proxacloud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/etc/nginx/certs:ro

  kubectl-runner:
    image: bitnami/kubectl:1.30
    container_name: proxacloud-kubectl-runner
    profiles:
      - ops
    depends_on:
      - backend
    environment:
      KUBECONFIG: /app/backend/.kube/config
    entrypoint: ["/bin/sh", "-lc"]
    command: ["sleep infinity"]
    volumes:
      - backend_data:/app/backend/data
      # Mount the same kubeconfig directory so kubectl-runner can read /app/backend/.kube/config.
      - ${KUBECONFIG_DIR:-/root/.kube}:/app/backend/.kube:ro

volumes:
  postgres_data:
  backend_data:
