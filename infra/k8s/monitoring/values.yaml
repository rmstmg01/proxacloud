prometheus:
  prometheusSpec:
    retention: 15d
    enableRemoteWriteReceiver: true
    externalLabels:
      cluster: management
      environment: production
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

grafana:
  enabled: true
  adminPassword: CHANGE_ME_BEFORE_INSTALL
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 10Gi

alertmanager:
  enabled: true

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true
