apiVersion: v1
kind: Service
metadata:
  name: pscs-prod-db-cluster
  namespace: pscs
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pscs-prod-db-cluster
  namespace: pscs
subsets:
  - addresses:
      - ip: 192.168.8.50
      - ip: 192.168.8.51
      - ip: 192.168.8.52
    ports:
      - name: mysql
        port: 3306
---
apiVersion: v1
kind: Secret
metadata:
  name: external-mariadb-client
  namespace: pscs
type: Opaque
stringData:
  DB_HOST: pscs-prod-db-cluster.pscs
  DB_PORT: "3306"
  DB_NAME: pscs
  DB_USER: pscs
  DB_PASS: replace-me
